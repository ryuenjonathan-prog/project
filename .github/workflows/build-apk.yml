name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk PhoneLidar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneLidar-apk
          path: PhoneLidar.apk

      # A release gives a direct APK link that opens and installs from the phone browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Phone LiDAR (сборка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: PhoneLidar.apk
          make_latest: true
          body: |
            Скачайте **PhoneLidar.apk** ниже прямо на телефон и установите.
